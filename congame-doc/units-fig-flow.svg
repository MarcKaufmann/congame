<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Fira, 'Fira Sans', system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#07A"/>
    </marker>
  </defs>

  <!-- top row: the parent study's steps -->
  <g font-family="'Fira Mono', Menlo, monospace" font-size="13" fill="#333">
    <rect x="10"  y="60" width="90"  height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="55"  y="85" text-anchor="middle">consent</text>

    <rect x="120" y="60" width="120" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="180" y="85" text-anchor="middle">pick-substudy</text>

    <rect x="260" y="60" width="120" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="320" y="85" text-anchor="middle">run-substudy</text>

    <rect x="400" y="60" width="90"  height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="445" y="85" text-anchor="middle">payment</text>

    <rect x="510" y="60" width="100" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="560" y="85" text-anchor="middle">thank-you</text>
  </g>
  <g stroke="#333" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="100" y1="80" x2="118" y2="80"/>
    <line x1="240" y1="80" x2="258" y2="80"/>
    <line x1="380" y1="80" x2="398" y2="80"/>
    <line x1="490" y1="80" x2="508" y2="80"/>
  </g>

  <!-- the slot below run-substudy -->
  <path d="M 320 100 L 320 150" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="200" y="152" width="240" height="120" rx="10" fill="#f5f7fa" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="174" text-anchor="middle" font-size="12" fill="#889">one of these, chosen at pick-substudy</text>
  <g font-family="'Fira Mono', Menlo, monospace" font-size="13" fill="#333">
    <rect x="220" y="186" width="200" height="32" rx="6" fill="#fff" stroke="#07A" stroke-width="1.5"/>
    <text x="320" y="207" text-anchor="middle">counting-study@</text>
    <rect x="220" y="228" width="200" height="32" rx="6" fill="#fff" stroke="#07A" stroke-width="1.5"/>
    <text x="320" y="249" text-anchor="middle">lottery-study@</text>
  </g>

  <!-- fee goes in (from the left), payment comes out (to the right) -->
  <path d="M 70 130 L 70 212 L 198 212" fill="none" stroke="#07A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="30" y="118" font-family="'Fira Mono', Menlo, monospace" font-size="12.5" fill="#07A">participation-fee</text>
  <text x="30" y="300" font-size="12" fill="#889">The fee goes in through get-fee.</text>

  <path d="M 442 212 L 560 212 L 560 130" fill="none" stroke="#07A" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="490" y="118" font-family="'Fira Mono', Menlo, monospace" font-size="12.5" fill="#07A">substudy-payment</text>
  <text x="620" y="300" text-anchor="end" font-size="12" fill="#889">The payment comes out through compute-payment.</text>
</svg>
