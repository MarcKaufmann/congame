<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Fira, 'Fira Sans', system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- the unit -->
  <rect x="200" y="40" width="240" height="220" rx="10" fill="#f5f7fa" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-family="'Fira Mono', Menlo, monospace" font-size="16" fill="#333">counting-task@</text>
  <text x="320" y="88" text-anchor="middle" font-size="12" fill="#889">a unit</text>

  <g font-family="'Fira Mono', Menlo, monospace" font-size="12.5" fill="#333">
    <text x="222" y="126">(defvar* problems-solved)</text>
    <text x="222" y="150">(defstep (instructions) …)</text>
    <text x="222" y="174">(defstep (problems) …)</text>
    <text x="222" y="198">(defstudy study …)</text>
    <text x="222" y="222">(define (compute-payment)</text>
    <text x="222" y="240">  …)</text>
  </g>

  <!-- import: socket on the left edge -->
  <rect x="190" y="130" width="20" height="40" rx="3" fill="#fff" stroke="#07A" stroke-width="1.5"/>
  <line x1="60" y1="150" x2="188" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="138" text-anchor="middle" font-family="'Fira Mono', Menlo, monospace" font-size="13" fill="#07A">get-fee</text>
  <text x="120" y="176" text-anchor="middle" font-size="12" fill="#889">import: fee^</text>
  <text x="120" y="194" text-anchor="middle" font-size="12" fill="#889">the parent supplies this</text>

  <!-- exports: plugs on the right edge -->
  <rect x="430" y="105" width="20" height="40" rx="3" fill="#fff" stroke="#07A" stroke-width="1.5"/>
  <line x1="452" y1="125" x2="580" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="113" text-anchor="middle" font-family="'Fira Mono', Menlo, monospace" font-size="13" fill="#07A">study</text>
  <text x="520" y="146" text-anchor="middle" font-size="12" fill="#889">export: study^</text>

  <rect x="430" y="185" width="20" height="40" rx="3" fill="#fff" stroke="#07A" stroke-width="1.5"/>
  <line x1="452" y1="205" x2="580" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="193" text-anchor="middle" font-family="'Fira Mono', Menlo, monospace" font-size="13" fill="#07A">compute-payment</text>
  <text x="520" y="226" text-anchor="middle" font-size="12" fill="#889">export: payment^</text>
  <text x="520" y="244" text-anchor="middle" font-size="12" fill="#889">the parent receives these</text>
</svg>
